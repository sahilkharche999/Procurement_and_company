services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    image: pco-frontend-image:latest
    container_name: editor-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - shared-network

  backend:
    # Without this the service ran whatever pco-backend-image:latest already
    # existed, so backend changes silently never reached the server.
    build:
      context: ./backend
    image: pco-backend-image:latest
    container_name: editor-backend
    expose:
      - "8000"
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SERVER_URL: ${SERVER_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}

      
    networks:
      - shared-network
    volumes:
      - /data/backend/local_file_db:/app/local_file_db

networks:
  shared-network:
    external: true
